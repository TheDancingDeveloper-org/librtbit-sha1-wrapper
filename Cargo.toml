[package]
name = "librtbit-sha1-wrapper"
version = "0.1.1"
edition = "2024"
description = "Pluggable SHA1/SHA256 abstraction for the rtbit BitTorrent client"
license = "MIT"
repository = "http://100.92.54.45:3002/indexarr/librtbit-sha1-wrapper"

[features]
default = ["sha1-crypto-hash"]
sha1-crypto-hash = ["crypto-hash"]
sha1-ring = ["aws-lc-rs"]

[dependencies]
assert_cfg = "0.1"
crypto-hash = { version = "0.3", optional = true }
aws-lc-rs = { version = "1.12", optional = true }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
